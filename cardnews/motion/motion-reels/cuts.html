<!doctype html>
<html><head><meta charset="utf-8"><title>motion cuts</title>
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
'use strict';
// ─────────────────────────────────────────────────────────────────────────────
// 모션 컷 장면 라이브러리. 계약은 하나 — window.frame(t) (t = 컷 안의 초).
// CSS 애니메이션·rAF·벽시계·시드 없는 난수 없음.
// 색·폰트·글자 구역은 이 파일에 적지 않는다: render-cuts.mjs 가 palette.mjs · safe-zone.mjs 를
// import 해서 window.setup() 으로 넘긴다. 이 파일에 숫자로 박힌 것은 구도(비율)뿐이다.
// 화면 글자는 전부 컷 JSON 필드에서만 온다 — 여기서 문자열 리터럴을 그리지 않는다.
//
// 바탕(ground) 두 벌 — 장면 코드는 palette 키를 직접 안 쓰고 역할(R)만 쓴다:
//   dark   : bg 바탕 · text 글자 (터미널과 같은 바탕 = 지난 시제품)
//   accent : accent 바탕 · onAccent 글자 (palette 가 「강조 배경 위에 얹는 글자색」으로 정의한 짝)
//            danger 는 accent 위에서 대비가 안 나와서 **bg 칩 위에** 얹는다.
// ─────────────────────────────────────────────────────────────────────────────
let W = 1080, H = 1920, P = null, F = null, Z = null, S = 1, CUT = null, FPS = 24, R = null, GROUND0 = null, LAYOUT0 = 'left', CENTER = false;
let ZFULL = null, ZUP = null, S0 = 1, FS = 1, FILL = null;
// marks: scene = 글자 구역 모서리 괄호 + 신호등 점(기본 · 예전 판) · edge = 프레임 가장자리 모서리만 · none = 괄호·점 없음
let MARKS = 'edge', FILLBOTTOM = false;   // 2026-09-29 사용자 결정: 기본 edge · none 은 후보 · scene 은 V-D·V-E 호환용   // center: 버튼 열 위쪽 구역(ZUP)에 들어가면 그쪽 · FS = 글자 배율
const SAMPLES = 3, SHUTTER = 0.5;
const cv = document.getElementById('c'); const mc = cv.getContext('2d');
const oc = document.createElement('canvas'); const ox = oc.getContext('2d');

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
function hash(a, b = 0, c = 0) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296;
}
function rgba(hex, a) { const h = hex.slice(1); const f = h.length === 3 ? h.split('').map(c => c + c).join('') : h; const n = parseInt(f, 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }

function roles(ground) {
  if (ground === 'accent') return {
    ground: P.accent, ink: P.onAccent, sub: P.onAccent, hi: P.onAccent,
    bad: P.danger, chip: P.bg,                 // danger 글자는 bg 칩 위
    hiChipFg: P.accent,                        // 강조 낱말: bg 칩 위 accent 글자 (반전)
    alarm: P.bg, grid: rgba(P.onAccent, 0.13), glow: P.text, glowA: 0.28, mark: P.onAccent,
    card: rgba(P.onAccent, 0.14), track: rgba(P.onAccent, 0.16), gauge: rgba(P.onAccent, 0.16), trackLine: P.onAccent, tick: rgba(P.onAccent, 0.45),
    scan: rgba(P.onAccent, 0.10), lighter: false, setA: P.onAccent, setB: P.text,
    ghost: [P.danger, P.bg], blocks: [P.onAccent, P.bg, P.text],
  };
  return {
    ground: P.bg, ink: P.text, sub: P.dim, hi: P.accent, bad: P.danger, chip: null, hiChipFg: null,
    alarm: P.danger, grid: rgba(P.line, 0.45), glow: null, glowA: 0.16, mark: P.accentDim,
    card: P.panel, track: P.panel, gauge: P.line, trackLine: P.line, tick: rgba(P.dim, 0.35),
    scan: 'rgba(0,0,0,0.28)', lighter: true, setA: P.accent, setB: P.info,
    ghost: [P.danger, P.info], blocks: [P.accent, P.info, P.danger],
  };
}

// ── 글자: 그릴 때마다 잉크 상자·글자색·밑색을 기기 좌표로 기록한다 (렌더러가 구역·대비를 검사) ──
let BOXES = [], CLIP = null;
function setFont(g, px, fam, w) { g.font = `${w} ${px}px ${fam === 'mono' ? F.mono : F.sans}`; g.letterSpacing = '0px'; }
function ink(g, str, px, fam, w) { setFont(g, px, fam, w); const m = g.measureText(str); return { l: m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight, a: m.actualBoundingBoxAscent, d: m.actualBoundingBoxDescent, w: m.actualBoundingBoxLeft + m.actualBoundingBoxRight, h: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent }; }
function fit(str, fam, w, maxW, maxH) { const k = ink(mc, str, 100, fam, w); let px = 100 * maxW / k.w; if (maxH) px = Math.min(px, 100 * maxH / k.h); return px * FS; }
// (x, y) = 잉크 기준점. align: 'l' | 'c' | 'r' (가로 잉크 기준), y 는 잉크 세로 중심
// o.on = 이 글자 밑의 색(대비 검사용) · o.decor = 장식 사본(대비 검사 제외, 구역 검사는 한다)
// o.chip = 글자 뒤에 칩을 깐다 (색)
function text(g, str, x, y, px, o = {}) {
  const fam = o.fam || 'sans', w = o.w || 800, k = ink(g, str, px, fam, w);
  const dx = o.align === 'c' ? x - k.w / 2 + k.l : o.align === 'r' ? x - k.r : x + k.l;
  const by = y + (k.a - k.d) / 2;
  if (o.chip) { const p = px * 0.12; g.fillStyle = o.chip; g.beginPath(); g.roundRect(dx - k.l - p, by - k.a - p, k.w + 2 * p, k.h + 2 * p, p); g.fill(); }
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = o.color || R.ink; g.fillText(str, dx, by);
  if (g.globalAlpha < 0.02) return k;
  const T = g.getTransform();
  const pts = [[dx - k.l, by - k.a], [dx + k.r, by - k.a], [dx - k.l, by + k.d], [dx + k.r, by + k.d]].map(([px2, py2]) => [T.a * px2 + T.c * py2 + T.e, T.b * px2 + T.d * py2 + T.f]);
  let b = { str, x0: Math.min(...pts.map(p => p[0])), x1: Math.max(...pts.map(p => p[0])), y0: Math.min(...pts.map(p => p[1])), y1: Math.max(...pts.map(p => p[1])) };
  const full = (b.x1 - b.x0) * (b.y1 - b.y0), ux0 = b.x0, ux1 = b.x1;   // 클립 전 가로 끝 (구역 고르기가 클립에 속지 않게)
  if (CLIP) { b = { str, x0: Math.max(b.x0, CLIP.x0), x1: Math.min(b.x1, CLIP.x1), y0: Math.max(b.y0, CLIP.y0), y1: Math.min(b.y1, CLIP.y1) }; if (b.x1 <= b.x0 || b.y1 <= b.y0) return k; }
  b.ux0 = ux0; b.ux1 = ux1; b.jitter = !!o.jitter;
  b.shown = full > 0 ? ((b.x1 - b.x0) * (b.y1 - b.y0)) / full : 1; b.alpha = g.globalAlpha;
  b.fg = o.nominal || o.color || R.ink; b.on = o.chip || o.on || R.ground; b.px = px * Math.abs(T.a); b.decor = !!o.decor;
  BOXES.push(b); return k;
}
// 나쁜 값: dark 바탕은 danger 글자, accent 바탕은 bg 칩 위 danger 글자
const bad = (o = {}) => ({ ...o, color: R.bad, chip: R.chip || undefined });
// 강조 낱말: dark 는 accent 글자, accent 는 bg 칩 위 accent 글자
const hiWord = (o = {}) => R.hiChipFg ? { ...o, color: R.hiChipFg, chip: R.chip } : { ...o, color: R.hi };
// 사각 클립 (변환 없는 좌표에서만 쓴다) — 클립 안 잉크만 기록되게 CLIP 을 같이 들고 간다
function clipRect(g, x0, y0, x1, y1) { g.beginPath(); g.rect(x0, y0, x1 - x0, y1 - y0); g.clip(); const T = g.getTransform(); const c = { x0: T.a * x0 + T.e, y0: T.d * y0 + T.f, x1: T.a * x1 + T.e, y1: T.d * y1 + T.f }; CLIP = CLIP ? { x0: Math.max(CLIP.x0, c.x0), y0: Math.max(CLIP.y0, c.y0), x1: Math.min(CLIP.x1, c.x1), y1: Math.min(CLIP.y1, c.y1) } : c; }

// ── 공통 바탕: 글자 없는 장식만 (격자 · 글로우 · 크롭 마크 · 신호등) ──
function base(g, t, glow) {
  g.fillStyle = R.ground; g.fillRect(0, 0, W, H);
  const gs = 54 * S; g.strokeStyle = R.grid; g.lineWidth = 1;
  g.beginPath(); for (let x = gs; x < W; x += gs) { g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); } for (let y = gs; y < H; y += gs) { g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); } g.stroke();
  const gc = R.glow || glow || P.accent;
  const gx0 = CENTER ? W / 2 : Z.cx;   // center: 떠 있는 장식은 프레임 중심
  const gr = g.createRadialGradient(gx0, Z.cy, 0, gx0, Z.cy, Math.max(W, H) * 0.6);
  gr.addColorStop(0, rgba(gc, R.glowA)); gr.addColorStop(1, rgba(gc, 0)); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  if (MARKS === 'scene') {
  const L = 34 * S, m = 22 * S; g.strokeStyle = R.mark; g.lineWidth = 3 * S; g.beginPath();
  const hw = Math.max(W / 2 - Z.x0, Z.x1 - W / 2), mx0 = CENTER ? W / 2 - hw : Z.x0, mx1 = CENTER ? W / 2 + hw : Z.x1;
  for (const [x, y, sx, sy] of [[mx0 - m, Z.y0 - m, 1, 1], [mx1 + m, Z.y0 - m, -1, 1], [mx0 - m, Z.y1 + m, 1, -1], [mx1 + m, Z.y1 + m, -1, -1]]) { g.moveTo(x, y + L * sy); g.lineTo(x, y); g.lineTo(x + L * sx, y); }
  g.stroke();
  P.dots.forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(mx0 + 10 * S + i * 30 * S, Z.y0 - m - 26 * S, 8 * S, 0, TAU); g.fill(); });
  } else if (MARKS === 'edge') {   // 프레임 가장자리 표시 — 글자를 감싸지 않는다 (크기는 배율과 무관하게 S0)
    const e = 40 * S0, L = 34 * S0; g.strokeStyle = R.mark; g.lineWidth = 3 * S0; g.beginPath();
    for (const [x, y, sx, sy] of [[e, e, 1, 1], [W - e, e, -1, 1], [e, H - e, 1, -1], [W - e, H - e, -1, -1]]) { g.moveTo(x, y + L * sy); g.lineTo(x, y); g.lineTo(x + L * sx, y); }
    g.stroke();
    P.dots.forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(e + 16 * S0 + i * 30 * S0, e + 30 * S0, 8 * S0, 0, TAU); g.fill(); });
  }   // none: 괄호도 점도 없다
}
function ring(g, x, y, r, col, a, lw) { if (a <= 0) return; g.strokeStyle = rgba(col, a); g.lineWidth = lw; g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke(); }

// ═════════════════════════════════════════════════════════════════════════════
// 컷 타입. draw(g, t, d, c) — c = 컷 JSON 한 칸
// ═════════════════════════════════════════════════════════════════════════════
const TYPES = {};

// 1) 숫자 펀치 — a.value 가 박히고, 세로로 굴러 b.value 로 바뀐다
TYPES.numberPunch = (g, t, d, c) => {
  const sA = c.switchSec != null ? c.switchSec / d : (c.switchAt ?? 0.40), sL = c.switchLenSec != null ? c.switchLenSec / d : (c.switchLen ?? 0.14);
  const sw = E.inOutExpo(seg(t, d * sA, d * (sA + sL)));
  base(g, t, sw > 0.5 ? P.danger : P.accent);
  const K = !!R.chip;   // 칩을 까는 바탕이면 칩 여백만큼 간격을 넓힌다 (dark 는 지난 시제품과 같은 값)
  const vf = K ? 0.78 : 0.82, vhf = K ? 0.28 : 0.3;
  const vpx = Math.min(fit(c.a.value, 'sans', 900, Z.w * vf, Z.h * vhf), fit(c.b.value, 'sans', 900, Z.w * vf, Z.h * vhf));
  const vk = ink(g, c.a.value, vpx, 'sans', 900), vh = vk.h;
  const lpx = Math.min(72 * S, Z.w * 0.12), cy = Z.cy + Z.h * 0.05, ly = cy - vh * 0.5 - lpx * (K ? 1.4 : 1.3);
  const win = { x0: Z.x0, y0: ly - lpx, x1: Z.x1, y1: cy + vh * (K ? 0.66 : 0.62) };
  const p1 = seg(t, 0.02, d * 0.5); ring(g, Z.cx, cy, vh * 0.5 + E.outExpo(p1) * Z.w * 0.6, R.hi, (1 - p1) * 0.7, 6 * S);
  const p2 = seg(t, d * 0.5, d); ring(g, Z.cx, cy, vh * 0.4 + E.outExpo(p2) * Z.w * 0.6, R.alarm, (1 - p2) * 0.7, 6 * S);
  g.save(); clipRect(g, win.x0, win.y0, win.x1, win.y1);
  const roll = vh * (K ? 1.6 : 1.5);
  if (sw < 1) {
    const inA = E.outBack(seg(t, 0, 0.16)), sc = lerp(0.62, 1, inA);
    g.save(); g.globalAlpha = 1 - sw;
    text(g, c.a.label, Z.cx, ly - sw * roll, lpx, { align: 'c', w: 800, color: R.sub });
    g.translate(Z.cx, cy - sw * roll); g.scale(sc, sc);
    text(g, c.a.value, 0, 0, vpx, { align: 'c', w: 900, color: R.hi });
    g.restore();
  }
  if (sw > 0) {
    const shake = (1 - seg(t, d * (sA + sL), d * (sA + sL + 0.16))) * 10 * S;
    g.save(); g.globalAlpha = sw;
    text(g, c.b.label, Z.cx, ly + (1 - sw) * roll, lpx, { align: 'c', w: 800, color: R.sub });
    g.translate(Z.cx + Math.sin(t * 150) * shake, cy + (1 - sw) * roll);
    text(g, c.b.value, 0, 0, vpx, bad({ align: 'c', w: 900 }));
    g.restore();
  }
  g.restore(); CLIP = null;
  const gy = win.y1 + 40 * S, gw = Z.w * 0.7, gx = Z.cx - gw / 2;
  g.fillStyle = R.gauge; g.fillRect(gx, gy, gw, 12 * S);
  g.fillStyle = R.hi; g.fillRect(gx, gy, gw * (1 - sw) * E.outCubic(seg(t, 0.04, 0.3)), 12 * S);
  if (c.caption) { const cp = Math.min(fit(c.caption, 'mono', 700, Z.w * 0.97), 40 * S); text(g, c.caption, Z.x0, Z.y0 + cp * 0.9, cp, { fam: 'mono', w: 700, color: R.sub }); }
  if (c.notes) { const np = Math.min(46 * S, Z.w * 0.068); c.notes.forEach((n, i) => text(g, n, Z.x0, Z.y1 - np * 0.8 - (c.notes.length - 1 - i) * np * 1.5, np, { w: 800, color: R.sub })); }
};

// 2) 대비 카운터 — 두 줄이 같이 세기 시작하고 한 줄만 올라간다
TYPES.contrastCounter = (g, t, d, c) => {
  base(g, t);
  const rows = c.rows, maxV = Math.max(...rows.map(r => r.value), 1);
  const lpx = Math.min(60 * S, Z.w * 0.09), npx = Math.min(fit('00', 'sans', 900, Z.w * 0.42), Z.h * 0.2);
  const nk = ink(g, '00', npx, 'sans', 900);
  const K = !!R.chip, g1 = (K ? 34 : 24) * S, g2 = (K ? 38 : 28) * S;
  const barH = 20 * S, blockH = lpx * 1.1 + g1 + nk.h + g2 + barH, gap = 90 * S;
  const fpx = Math.min(44 * S, Z.w * 0.065);
  const tpx = c.title ? Math.min(64 * S, Z.w * 0.095) : 0, tH = c.title ? tpx * 1.2 + 56 * S : 0;
  const total = tH + rows.length * blockH + (rows.length - 1) * gap + (c.foot ? fpx * 2.6 : 0);
  let y = Z.cy - total / 2;
  if (c.title) { const ta = E.outExpo(seg(t, 0, 0.15)); g.save(); g.globalAlpha = ta; text(g, c.title, Z.x0, y + tpx * 0.6, tpx, { w: 900, color: R.ink }); g.restore();
    g.fillStyle = R.hi; g.fillRect(Z.x0, y + tpx * 1.2 + 14 * S, Z.w * E.outCubic(seg(t, 0.05, 0.3)), 5 * S); y += tH; }
  const cS = c.countSec || [0.06, d * 0.6];
  const prog = E.outCubic(seg(t, cS[0], cS[1]));
  const pS = c.popSec != null ? [c.popSec, c.popSec + d * 0.14] : [d * 0.58, d * 0.72];
  rows.forEach((r, i) => {
    const a = E.outExpo(seg(t, i * 0.05, 0.2 + i * 0.05)), dx = (1 - a) * -Z.w * 0.4;
    const good = r.tone !== 'bad';
    g.save(); clipRect(g, Z.x0, Z.y0, Z.x1, Z.y1); g.globalAlpha = a; g.translate(dx, 0);
    text(g, r.label, Z.x0, y + lpx * 0.55, lpx, { w: 800, color: R.sub });
    const v = Math.round(r.value * prog);
    const ny = y + lpx * 1.1 + g1 + nk.h / 2;
    const pop = !good ? 1 + 0.08 * Math.sin(Math.PI * seg(t, pS[0], pS[1])) : 1;
    const nx = Z.x0 + (R.chip && !good ? npx * 0.12 : 0);   // 칩이 구역 밖으로 안 나가게
    g.save(); g.translate(nx, ny); g.scale(pop, pop); text(g, String(v), 0, 0, npx, good ? { w: 900, color: R.ink } : bad({ w: 900 })); g.restore();
    const by = ny + nk.h / 2 + g2;
    g.fillStyle = R.track; g.fillRect(Z.x0, by, Z.w, barH);
    g.strokeStyle = R.trackLine; g.lineWidth = 2 * S; g.strokeRect(Z.x0, by, Z.w, barH);
    const bw = Z.w * (r.value / maxV) * prog;
    if (bw > 0) { g.fillStyle = good ? R.hi : R.alarm; g.fillRect(Z.x0, by, bw, barH); }
    else { const bl = Math.floor(t * FPS / 3) % 2; if (bl) { g.fillStyle = R.alarm; g.fillRect(Z.x0, by - 6 * S, 6 * S, barH + 12 * S); } }
    g.fillStyle = R.tick; for (let k = 1; k < maxV; k++) g.fillRect(Z.x0 + Z.w * k / maxV, by + barH + 6 * S, 2 * S, 8 * S);
    g.restore(); CLIP = null;
    y += blockH + gap;
  });
  const fa = E.outExpo(seg(t, d * 0.5, d * 0.7));
  if (fa > 0 && c.foot) { g.save(); g.globalAlpha = fa; text(g, c.foot, Z.x0, y - gap + fpx * 1.6 + (1 - fa) * 20 * S, fpx, { fam: 'mono', w: 700, color: R.sub }); g.restore(); }
};

// 3) 키네틱 타이포 — 낱말이 한 줄씩 마스크에서 올라오고, 소리 파형이 평평해진다
TYPES.kinetic = (g, t, d, c) => {
  base(g, t);
  const words = c.words, last = words.length - 1;
  // 칩을 까는 바탕에서는 마지막 낱말을 칩 여백만큼 줄인다 (dark 는 지난 시제품과 같다)
  const fw = c.fitW ?? 1;   // 1 = 지난 시제품 값. 가장자리 반올림 여유가 필요하면 JSON 에서 줄인다

// 10) 판정 — a 가 깔리고 b 가 올라온 뒤 hi 가 박힌다 (반전)

// 11) 한계 카드 — head 상자 + items (칸에 맞춰 낱말 단위로 줄바꿈)
function wrapWords(g, str, px, fam, w, maxW) {
  const words = str.split(' '); const lines = []; let cur = '';

TYPES.limits = (g, t, d, c) => {

// ═════════════════════════════════════════════════════════════════════════════
// layout: "center" (2026-09-29 신설 · 10/12 기본값)
//   ① 장면마다 **글자 블록 전체의 중심 = 글자 구역(글자안전()) 중심** (CX = Z.cx, CY = Z.cy). 글자는 가운데 정렬.
//   ② **떠 있는 장식**(그리드·글로우·크롭 마크·충격파 링·파형·집합 원)은 **프레임 중심 FX = W/2** 대칭.
//      글자 구역이 오른쪽 버튼 열 때문에 좌우 비대칭이라, 장식까지 CX 에 두면 눈의 무게중심이 왼쪽으로 쏠린다.
//   ③ **글자에 붙은 장식**(칩·게이지·카운터 막대·줄긋기·아이콘·명령 카드·타임라인 연결선·판정 버스트)은 그 글자를 따른다.
//      붙은 장식을 FX 로 보내면 글자와 122px 어긋난다.
//   layout "left"(V-D · V-E)의 코드는 위 TYPES 에 그대로 있고 한 줄도 안 바뀐다.
// ═════════════════════════════════════════════════════════════════════════════
const TYPES_C = {};
const FXc = () => W / 2;
// 쌓은 줄들의 전체 높이 → 구역 세로 중심에 맞춘 맨 위 y
const topFor = (total) => Z.cy - total / 2;

TYPES_C.numberPunch = (g, t, d, c) => {
  const sA = c.switchSec != null ? c.switchSec / d : (c.switchAt ?? 0.40), sL = c.switchLenSec != null ? c.switchLenSec / d : (c.switchLen ?? 0.14);
  const one = !c.b;   // 값 하나짜리 컷 (쪼갠 장면) — 전환 없음
  const sw = one ? 0 : E.inOutExpo(seg(t, d * sA, d * (sA + sL)));
  const aBad = c.a.tone === 'bad';
  base(g, t, sw > 0.5 ? P.danger : P.accent);
  const K = !!R.chip, vf = K ? 0.78 : 0.82, vhf = K ? 0.26 : 0.28;
  const vpx = Math.min(fit(c.a.value, 'sans', 900, Z.w * vf, Z.h * vhf), one ? Infinity : fit(c.b.value, 'sans', 900, Z.w * vf, Z.h * vhf));

  const cp = c.caption ? Math.min(fit(c.caption, 'mono', 700, Z.w * 0.97), 40 * S) : 0, capH = c.caption ? cp * 1.2 + 60 * S : 0;
  const np = Math.min(46 * S, Z.w * 0.068 * FS), notesH = c.notes ? 56 * S + c.notes.length * np * 1.5 : 0;
  const above = vh * 0.5 + lpx * (K ? 1.9 : 1.8), below = vh * (K ? 0.66 : 0.62) + 52 * S;

  const p1 = seg(t, 0.02, d * 0.5); ring(g, FXc(), cy, vh * 0.5 + E.outExpo(p1) * Z.w * 0.6, R.hi, (1 - p1) * 0.7, 6 * S);
  if (!one) { const p2 = seg(t, d * 0.5, d); ring(g, FXc(), cy, vh * 0.4 + E.outExpo(p2) * Z.w * 0.6, R.alarm, (1 - p2) * 0.7, 6 * S); }
  g.save(); clipRect(g, win.x0, win.y0, win.x1, win.y1);
  const roll = vh * (K ? 1.6 : 1.5);

    const sc = lerp(0.62, 1, E.outBack(seg(t, 0, 0.16)));
    g.save(); g.globalAlpha = 1 - sw;
    text(g, c.a.label, Z.cx, ly - sw * roll, lpx, { align: 'c', w: 800, color: R.sub });
    g.translate(Z.cx, cy - sw * roll); g.scale(sc, sc); text(g, c.a.value, 0, 0, vpx, aBad ? bad({ align: 'c', w: 900 }) : { align: 'c', w: 900, color: R.hi });
    g.restore();

    g.save(); g.globalAlpha = sw;
    text(g, c.b.label, Z.cx, ly + (1 - sw) * roll, lpx, { align: 'c', w: 800, color: R.sub });
    g.translate(Z.cx + Math.sin(t * 150) * shake, cy + (1 - sw) * roll); text(g, c.b.value, 0, 0, vpx, bad({ align: 'c', w: 900 }));
    g.restore();

  g.fillStyle = R.gauge; g.fillRect(gx, gy, gw, 12 * S);
  g.fillStyle = R.hi; g.fillRect(gx, gy, gw * (one ? (aBad ? 0 : 1) : 1 - sw) * E.outCubic(seg(t, 0.04, 0.3)), 12 * S);
  if (c.caption) text(g, c.caption, Z.cx, y0 + cp * 0.6, cp, { align: 'c', fam: 'mono', w: 700, color: R.sub });
  if (c.notes) c.notes.forEach((n, i) => text(g, n, Z.cx, gy + 12 * S + 56 * S + np * 0.75 + i * np * 1.5, np, { align: 'c', w: 800, color: R.sub }));

TYPES_C.contrastCounter = (g, t, d, c) => {
  base(g, t);
  const rows = c.rows, maxV = Math.max(...rows.map(r => r.value), 1);
  const lpx = Math.min(60 * S, Z.w * 0.09 * FS), npx = Math.min(fit('00', 'sans', 900, Z.w * 0.42), Z.h * 0.2 * FS), nk = ink(g, '00', npx, 'sans', 900);
  const K = !!R.chip, g1 = (K ? 34 : 24) * S, g2 = (K ? 38 : 28) * S, barH = 20 * S, blockH = lpx * 1.1 + g1 + nk.h + g2 + barH, gap = 90 * S;
  const fpx = Math.min(44 * S, Z.w * 0.065 * FS), tpx = c.title ? Math.min(64 * S, Z.w * 0.095 * FS) : 0, tH = c.title ? tpx * 1.2 + 56 * S : 0;
  const total = tH + rows.length * blockH + (rows.length - 1) * gap + (c.foot ? fpx * 2.6 : 0);
  let y = topFor(total);
  if (c.title) { const ta = E.outExpo(seg(t, 0, 0.15)); g.save(); g.globalAlpha = ta; text(g, c.title, Z.cx, y + tpx * 0.6, tpx, { align: 'c', w: 900, color: R.ink }); g.restore();
    const uw = Z.w * E.outCubic(seg(t, 0.05, 0.3)); g.fillStyle = R.hi; g.fillRect(Z.cx - uw / 2, y + tpx * 1.2 + 14 * S, uw, 5 * S); y += tH; }

    g.save(); clipRect(g, Z.x0, Z.y0, Z.x1, Z.y1); g.globalAlpha = a; g.translate(0, dy);
    text(g, r.label, Z.cx, y + lpx * 0.55, lpx, { align: 'c', w: 800, color: R.sub });
    const v = Math.round(r.value * prog), ny = y + lpx * 1.1 + g1 + nk.h / 2;
    const pop = !good ? 1 + 0.08 * Math.sin(Math.PI * seg(t, pS[0], pS[1])) : 1;
    g.save(); g.translate(Z.cx, ny); g.scale(pop, pop); text(g, String(v), 0, 0, npx, good ? { align: 'c', w: 900, color: R.ink } : bad({ align: 'c', w: 900 })); g.restore();
    const by = ny + nk.h / 2 + g2;
    g.fillStyle = R.track; g.fillRect(Z.x0, by, Z.w, barH); g.strokeStyle = R.trackLine; g.lineWidth = 2 * S; g.strokeRect(Z.x0, by, Z.w, barH);
    const bw = Z.w * (r.value / maxV) * prog;

    g.fillStyle = R.tick; for (let k = 1; k < maxV; k++) g.fillRect(Z.x0 + Z.w * k / maxV, by + barH + 6 * S, 2 * S, 8 * S);

};

TYPES_C.glitchEquation = (g, t, d, c) => {
  const cpx = Math.min(48 * S, Z.w * 0.075 * FS);

TYPES_C.command = (g, t, d, c) => {

TYPES_C.timeline = (g, t, d, c) => {

  let y = topFor(blk * 2 + gp * 2 + arrow);
  const fa = E.outExpo(seg(t, 0.02, 0.2));
  if (fa > 0) { g.save(); g.globalAlpha = fa; text(g, c.from.label, Z.cx, y + lpx * 0.5, lpx, { align: 'c', w: 800, color: R.sub }); text(g, c.from.date, Z.cx, y + lpx * 1.2 + dk.h / 2, dpx, { align: 'c', fam: 'mono', w: 700, color: R.ink }); g.restore(); }
  y += blk + gp;
  const dr = E.inOutCubic(seg(t, 0.05, 0.5));   // 두 날짜를 잇는 선 하나 (세로) — 표시는 기본 끔
  g.strokeStyle = R.trackLine; g.lineWidth = 6 * S; g.lineCap = 'round'; g.beginPath(); g.moveTo(Z.cx, y); g.lineTo(Z.cx, y + arrow * dr); g.stroke();
  if (dr > 0.98 && !(c.marks > 0)) { const ah = 22 * S; g.fillStyle = R.trackLine; g.beginPath(); g.moveTo(Z.cx, y + arrow + 6 * S); g.lineTo(Z.cx - ah * 0.7, y + arrow - ah); g.lineTo(Z.cx + ah * 0.7, y + arrow - ah); g.closePath(); g.fill(); }
  const MK = c.marks > 0 ? c.marks : 0;
  for (let k = 0; k < MK; k++) { const u = MK === 1 ? 0 : k / (MK - 1), p = E.outBack(seg(dr, u - 0.02, u + 0.12)); if (p > 0) { g.fillStyle = R.hi; g.beginPath(); g.arc(Z.cx, y + arrow * u, 10 * S * p, 0, TAU); g.fill(); } }
  y += arrow + gp;
  const ta = E.outExpo(seg(t, 0.42, 0.6));
  if (ta > 0) { g.save(); g.globalAlpha = ta; text(g, c.to.label, Z.cx, y + lpx * 0.5, lpx, { align: 'c', w: 800, color: R.sub }); text(g, c.to.date, Z.cx, y + lpx * 1.2 + dk.h / 2, dpx, { align: 'c', fam: 'mono', w: 700, color: R.ink }); g.restore(); }
};

TYPES_C.stamp = (g, t, d, c) => {
  const apx = fit(c.a, 'sans', 900, Z.w * 0.8, Z.h * 0.2), ak = ink(g, c.a, apx, 'sans', 900);
  const bpx = c.b ? fit(c.b, 'sans', 800, Z.w * 0.8, Z.h * 0.12) : 0, bk = c.b ? ink(g, c.b, bpx, 'sans', 800) : null;
  const ih = 190 * S, textH = ak.h + (c.b ? 34 * S + bk.h : 0);
  TYPES.stamp(g, t, d, { ...c, _iy: Z.cy - textH / 2 - 70 * S - ih });   // 글자 블록 중심 = 구역 중심 · 아이콘은 위 장식   // 아이콘·체크·글자 순서는 같고 맨 위 y 만 받는다
};

TYPES_C.verdict = (g, t, d, c) => TYPES.verdict(g, t, d, { ...c, _center: true });
TYPES_C.kinetic = (g, t, d, c) => TYPES.kinetic(g, t, d, c);   // 글자는 원래 가운데 · 파형만 CENTER 분기로 FX 대칭
TYPES_C.strike = (g, t, d, c) => TYPES.strike(g, t, d, c);     // 원래 가운데 정렬

TYPES_C.limits = (g, t, d, c) => {
  base(g, t);
  const hpx = Math.min(96 * S, Z.w * 0.14 * FS), hk = ink(g, c.head, hpx, 'sans', 900), bp = 22 * S;
  const ipx = Math.min(60 * S, Z.w * 0.088 * FS), bw = 44 * S, lh = ipx * 1.35;
  const wrapped = c.items.map(it => wrapWords(g, it, ipx, 'sans', 800, Z.w - bw * 2));
  const itemsH = wrapped.reduce((a, ls) => a + ls.length * lh + 50 * S, 0) - 50 * S;
  let y = topFor(hk.h + bp * 2 + 70 * S + itemsH);
  const ha = E.outExpo(seg(t, 0, 0.15));
  g.save(); g.globalAlpha = ha; g.strokeStyle = R.ink; g.lineWidth = 5 * S; g.strokeRect(Z.cx - hk.w / 2 - bp, y, hk.w + bp * 2, hk.h + bp * 2);
  text(g, c.head, Z.cx, y + bp + hk.h / 2, hpx, { align: 'c', w: 900, color: R.ink }); g.restore();
  y += hk.h + bp * 2 + 70 * S;
  wrapped.forEach((lines, i) => {
    const p = E.outExpo(seg(t, 0.12 + i * (c.stagger ?? 0.3), 0.3 + i * (c.stagger ?? 0.3)));
    g.save(); clipRect(g, Z.x0, Z.y0, Z.x1, Z.y1); g.globalAlpha = p; g.translate(0, (1 - p) * 30 * S);
    lines.forEach((ln, j) => { const k = text(g, ln, Z.cx, y + lh / 2 + j * lh, ipx, { align: 'c', w: 800, color: R.ink }); if (j === 0) { g.fillStyle = R.hi; g.fillRect(Z.cx - k.w / 2 - 38 * S, y + lh / 2 - 11 * S, 22 * S, 22 * S); } });
    g.restore(); CLIP = null;
    y += lines.length * lh + 50 * S;
  });
};

// ═════════════════════════════════════════════════════════════════════════════
// 사전 10종 (2026-09-30 · 모션그래픽 주문 사전 dx.json 의 장면 명세를 우리 계약으로 옮김 — 시험판)
//   원 명세는 가로 16:9 · 우리는 세로 9:16 이라 **가로로 늘어선 것은 세로로 쌓았다**(흐름도·전후 비교).
//   ⛔ 원 명세의 라벨 글자(「오늘의 용어」·「OX 퀴즈」·「BEFORE」·「Q」·입력창 안내문)는 **그리지 않는다** — 화면 글자는 장면 JSON 필드에서만.
//      그 자리는 모양(색 띠·원·빈 알약)으로 둔다. 카운트다운 숫자도 없다(고리만).
//   박자: 각 타입의 BASE 초 기준 비트 — 장면이 BASE 보다 **짧으면 비율로 줄이고, 길면 등장은 그대로 두고 끝의 머무는 구간만 늘어난다**(kb).
//   볼거리(wow)는 장면마다 한 번.
// ═════════════════════════════════════════════════════════════════════════════
const kb = (d, base) => Math.min(1, d / base);            // 비트 배율: 짧을 때만 줄인다
const solidCard = () => R.chip || P.panel;               // 속이 찬 카드: dark = panel · accent = bg 칩
const onSolid = () => ({ ink: P.text, sub: P.dim, hi: P.accent });   // 속이 찬 카드 위 글자 (두 바탕 공통)
const hiFill = () => R.chip ? { fill: P.bg, fg: P.accent } : { fill: P.accent, fg: P.onAccent };   // 강조 면
function wrapPx(g, str, fam, w, maxW, maxPx, maxLines) {   // 줄 수 한도 안에서 가장 큰 글자
  let px = maxPx, lines = wrapWords(g, str, px, fam, w, maxW);
  while ((lines.length > maxLines || lines.some((l) => ink(g, l, px, fam, w).w > maxW)) && px > 20 * S) { px *= 0.94; lines = wrapWords(g, str, px, fam, w, maxW); }
  return { px, lines };
}
function roundBox(g, x, y, w, h, r, fill, stroke, lw) { g.beginPath(); g.roundRect(x, y, w, h, r); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 3 * S; g.stroke(); } }
const BASE_DICT = { termCard: 4.4, flowDiagram: 4.5, quizOX: 5.2, chatUI: 6.6, spotlight: 4.5, innerThought: 3.8, speedLines: 1.8, beforeAfter: 3.4, progressBar: 3.6, faqFlip: 7.0 };

// T17 용어 팝업 카드 — 카드 톡 → 뜻 타자 → 형광펜 → 머묾 (wow: 형광펜 끝에서 뜻이 한 번 커졌다 돌아옴)
TYPES.termCard = (g, t, d, c) => {
  base(g, t); const k = kb(d, BASE_DICT.termCard), T = (x) => x * k, O = onSolid();
  const cw = Z.w * 0.9, pad = 44 * S;
  const tpx = fit(c.term, 'sans', 900, cw - pad * 2, Z.h * 0.14), tk = ink(g, c.term, tpx, 'sans', 900);
  const fpx = c.full ? Math.min(fit(c.full, 'sans', 700, cw - pad * 2), 40 * S) : 0;
  const m = wrapPx(g, c.mean, 'sans', 800, cw - pad * 2, Math.min(64 * S, tpx * 0.6), 2), mlh = m.px * 1.35;
  const ch = pad + 16 * S + tk.h + (c.full ? 24 * S + fpx : 0) + 44 * S + m.lines.length * mlh + pad;
  const y0 = topFor(ch), x0 = Z.cx - cw / 2;
  const pop = E.outBack(seg(t, T(0.2), T(0.6))); if (pop <= 0) return;
  g.save(); g.translate(Z.cx, y0 + ch / 2); g.rotate(lerp(-0.1, 0, pop)); g.scale(lerp(0.6, 1, pop), lerp(0.6, 1, pop)); g.globalAlpha = clamp(pop * 1.4); g.translate(-Z.cx, -(y0 + ch / 2));
  roundBox(g, x0, y0, cw, ch, 28 * S, solidCard());
  g.fillStyle = O.hi; g.fillRect(x0 + pad, y0 + 16 * S, 90 * S, 8 * S);   // 머리 띠 (원 명세의 「오늘의 용어」 자리 — 글자 대신 모양)
  let y = y0 + pad + 16 * S;
  text(g, c.term, Z.cx, y + tk.h / 2, tpx, { align: 'c', w: 900, color: O.ink, on: solidCard() }); y += tk.h;
  if (c.full) { y += 24 * S; text(g, c.full, Z.cx, y + fpx / 2, fpx, { align: 'c', w: 700, color: O.sub, on: solidCard() }); y += fpx; }
  y += 44 * S;
  const total = m.lines.reduce((a, l) => a + [...l].length, 0), nch = Math.floor(seg(t, T(0.9), T(1.9)) * total + 1e-6);
  const hl = E.inOutCubic(seg(t, T(2.1), T(2.6))), wow = 1 + 0.06 * Math.sin(Math.PI * seg(t, T(2.6), T(2.9)));
  let left = nch;
  m.lines.forEach((ln, j) => {
    const cy = y + mlh / 2 + j * mlh, cs = [...ln], shown = cs.slice(0, Math.max(0, left)).join(''); left -= cs.length;
    const lk = ink(g, ln, m.px, 'sans', 800);
    if (hl > 0) { g.fillStyle = rgba(P.accent, 0.42); g.fillRect(Z.cx - lk.w / 2 - 6 * S, cy + lk.h * 0.12, (lk.w + 12 * S) * hl, lk.h * 0.42); }
    if (!shown) return;
    g.save(); g.translate(Z.cx, cy); g.scale(wow, wow);
    text(g, shown, -lk.w / 2, 0, m.px, { w: 800, color: O.ink, on: solidCard() });   // 왼쪽 끝 고정 — 타자 중에 줄이 좌우로 흔들리지 않게
    g.restore();
  });
  g.restore();
};

// T10 개념 도해 — 상자 톡 → 화살표가 선을 그림 → 다음 상자 (세로로 쌓음) · wow: 마지막 상자만 크게 튕기며 빛
TYPES.flowDiagram = (g, t, d, c) => {
  base(g, t); const k = kb(d, BASE_DICT.flowDiagram), T = (x) => x * k, O = onSolid(), H2 = hiFill();
  const n = c.steps.length, bw = Z.w * 0.82, gapA = 96 * S, pad = 30 * S;
  const fitted = c.steps.map((s) => wrapPx(g, s, 'sans', 900, bw - pad * 2, 70 * S, 2));
  const px = Math.min(...fitted.map((f) => f.px)), rows = c.steps.map((s) => wrapWords(g, s, px, 'sans', 900, bw - pad * 2));
  const bh = rows.map((ls) => ls.length * px * 1.3 + pad * 2), total = bh.reduce((a, b) => a + b, 0) + gapA * (n - 1);
  let y = topFor(total); const step = 0.9;
  rows.forEach((ls, i) => {
    const p0 = T(0.2 + i * step), p = E.outBack(seg(t, p0, p0 + T(0.4))), last = i === n - 1;
    const wow = last ? 1 + 0.08 * Math.sin(Math.PI * seg(t, p0 + T(0.4), p0 + T(0.75))) : 1;
    if (p > 0) {
      const fill = last ? H2.fill : solidCard(), fg = last ? H2.fg : O.ink;
      g.save(); g.translate(Z.cx, y + bh[i] / 2); g.scale(lerp(0.5, 1, p) * wow, lerp(0.5, 1, p) * wow); g.globalAlpha = clamp(p * 1.5);
      if (last && wow > 1.001) { g.shadowColor = rgba(P.accent, 0.9); g.shadowBlur = 60 * S * (wow - 1) / 0.08; }
      roundBox(g, -bw / 2, -bh[i] / 2, bw, bh[i], 24 * S, fill); g.shadowBlur = 0;
      ls.forEach((ln, j) => text(g, ln, 0, -bh[i] / 2 + pad + px * 0.65 + j * px * 1.3, px, { align: 'c', w: 900, color: fg, on: fill }));
      g.restore();
    }
    y += bh[i];
    if (!last) {   // 화살표: 상자 사이에만 (상자를 뚫지 않는다)
      const a = E.inOutCubic(seg(t, T(0.6 + i * step), T(1.1 + i * step)));
      if (a > 0) { const ax = Z.cx, ay0 = y + 14 * S, ay1 = y + gapA - 14 * S, ye = lerp(ay0, ay1, a);
        g.strokeStyle = R.ink; g.lineWidth = 7 * S; g.lineCap = 'round'; g.beginPath(); g.moveTo(ax, ay0); g.lineTo(ax, ye); g.stroke();
        if (a > 0.9) { const ah = 20 * S; g.fillStyle = R.ink; g.beginPath(); g.moveTo(ax, ay1 + 4 * S); g.lineTo(ax - ah, ay1 - ah); g.lineTo(ax + ah, ay1 - ah); g.closePath(); g.fill(); } }
      y += gapA;
    }
  });
};

// T14 OX 퀴즈 — 문제 + 줄어드는 고리 → 0 에서 정답 도장 쾅 → 0.3s 뒤 해설 · ⛔ 도장 전에는 해설을 안 보인다 · wow: 도장 순간 화면이 한 번 쿵
TYPES.quizOX = (g, t, d, c) => {
  const k = kb(d, BASE_DICT.quizOX), T = (x) => x * k, sec = (c.countSec ?? 2.6);
  const tStamp = T(0.5 + sec), shake = (1 - seg(t, tStamp, tStamp + T(0.25))) * (t >= tStamp ? 16 * S : 0);
  g.save(); g.translate(Math.sin(t * 170) * shake, Math.cos(t * 130) * shake * 0.6);
  base(g, t);
  const q = wrapPx(g, c.q, 'sans', 900, Z.w * 0.92, 80 * S, 3), qlh = q.px * 1.3;
  const rr = Math.min(Z.w * 0.26, 190 * S), e = wrapPx(g, c.exp, 'sans', 800, Z.w * 0.92, 56 * S, 2), elh = e.px * 1.35;
  const total = q.lines.length * qlh + 70 * S + rr * 2 + 70 * S + e.lines.length * elh;
  let y = topFor(total);
  const qa = E.outExpo(seg(t, 0, T(0.35)));
  g.save(); g.globalAlpha = qa; q.lines.forEach((ln, j) => text(g, ln, Z.cx, y + qlh / 2 + j * qlh + (1 - qa) * 30 * S, q.px, { align: 'c', w: 900, color: R.ink })); g.restore();
  y += q.lines.length * qlh + 70 * S;
  const cx = FXc(), cy = y + rr, left = 1 - seg(t, T(0.5), tStamp);
  ring(g, cx, cy, rr, R.chip ? P.bg : P.line, 0.55, 22 * S);
  if (left > 0) { g.strokeStyle = R.alarm; g.lineWidth = 22 * S; g.lineCap = 'round'; g.beginPath(); g.arc(cx, cy, rr, -Math.PI / 2, -Math.PI / 2 + TAU * left); g.stroke(); }
  const sp = seg(t, tStamp, tStamp + T(0.2));
  if (sp > 0) {   // 정답 기호는 모양으로 그린다 (글자 아님)
    const sc = lerp(2, 1, E.outCubic(sp)), rot = lerp(-0.5, -0.12, E.outCubic(sp)), sz = rr * 0.72;
    g.save(); g.translate(cx, cy); g.rotate(rot); g.scale(sc, sc); g.globalAlpha = clamp(sp * 2);
    g.strokeStyle = R.alarm; g.lineWidth = 30 * S; g.lineCap = 'round'; g.beginPath();
    if (c.ans === 'O') g.arc(0, 0, sz, 0, TAU); else { g.moveTo(-sz, -sz); g.lineTo(sz, sz); g.moveTo(sz, -sz); g.lineTo(-sz, sz); }
    g.stroke(); g.restore();
  }
  y += rr * 2 + 70 * S;
  const ea = E.outExpo(seg(t, tStamp + T(0.3), tStamp + T(0.6)));
  if (ea > 0) { g.save(); g.globalAlpha = ea; e.lines.forEach((ln, j) => text(g, ln, Z.cx, y + elh / 2 + j * elh, e.px, { align: 'c', w: 800, color: R.ink })); g.restore(); }
  g.restore();
};

// T11 AI 채팅 화면 — 질문 타자 → 점 세 개 → 답이 한 줄씩 · wow: 마지막 글자에서 답 말풍선이 한 번 톡 · ⛔ 실제 서비스 화면·로고 흉내 없음
TYPES.chatUI = (g, t, d, c) => {
  base(g, t); const k = kb(d, BASE_DICT.chatUI), T = (x) => x * k, O = onSolid(), H2 = hiFill();
  const bwMax = Z.w * 0.8, pad = 30 * S;
  const q = wrapPx(g, c.q, 'sans', 800, bwMax - pad * 2, 54 * S, 3), qlh = q.px * 1.35;
  const apx = Math.min(...c.answers.map((a) => wrapPx(g, a, 'sans', 800, bwMax - pad * 2, 54 * S, 2).px));
  const aLines = c.answers.flatMap((a) => wrapWords(g, a, apx, 'sans', 800, bwMax - pad * 2)), alh = apx * 1.4;
  const qw = Math.max(...q.lines.map((l) => ink(g, l, q.px, 'sans', 800).w)) + pad * 2, qh = q.lines.length * qlh + pad * 2;
  const aw = Math.max(...aLines.map((l) => ink(g, l, apx, 'sans', 800).w), 160 * S) + pad * 2, ah = aLines.length * alh + pad * 2;
  const inH = 84 * S, total = qh + 50 * S + ah + 80 * S + inH;
  let y = topFor(total); const xR = Z.cx + Z.w * 0.45, xL = Z.cx - Z.w * 0.45;
  // 질문 (오른쪽 · 강조 면)
  const qa = E.outBack(seg(t, T(0.15), T(0.35)));
  if (qa > 0) {
    g.save(); g.globalAlpha = clamp(qa * 1.5); roundBox(g, xR - qw, y, qw, qh, 30 * S, H2.fill);
    const tot = q.lines.reduce((a, l) => a + [...l].length, 0); let left = Math.floor(seg(t, T(0.3), T(1.4)) * tot + 1e-6);
    q.lines.forEach((ln, j) => { const cs = [...ln], sh = cs.slice(0, Math.max(0, left)).join(''); left -= cs.length; if (sh) text(g, sh, xR - qw + pad, y + pad + qlh / 2 + j * qlh, q.px, { w: 800, color: H2.fg, on: H2.fill }); });
    g.restore();
  }
  y += qh + 50 * S;
  // 답 (왼쪽 · 카드) — 점 세 개가 먼저
  const dotsA = seg(t, T(1.6), T(1.8)) * (1 - seg(t, T(2.4), T(2.5))), bub = seg(t, T(2.4), T(2.6));
  if (dotsA > 0) { roundBox(g, xL, y, 170 * S, 96 * S, 30 * S, solidCard()); for (let i = 0; i < 3; i++) { const on = Math.floor((t / T(0.18)) + i) % 3 === 0; g.fillStyle = rgba(O.sub, on ? 1 : 0.45); g.beginPath(); g.arc(xL + 50 * S + i * 36 * S, y + 48 * S, 11 * S, 0, TAU); g.fill(); } }
  if (bub > 0) {
    const tot = aLines.reduce((a, l) => a + [...l].length, 0), pr = seg(t, T(2.5), T(5.0));
    const wow = 1 + 0.05 * Math.sin(Math.PI * seg(t, T(5.0), T(5.25)));
    g.save(); g.translate(xL, y); g.scale(wow, wow); g.globalAlpha = clamp(bub * 2);
    roundBox(g, 0, 0, aw, ah, 30 * S, solidCard());
    let left = Math.floor(pr * tot + 1e-6);
    aLines.forEach((ln, j) => { const cs = [...ln], sh = cs.slice(0, Math.max(0, left)).join(''); left -= cs.length; if (sh) text(g, sh, pad, pad + alh / 2 + j * alh, apx, { w: 800, color: O.ink, on: solidCard() }); });
    g.restore();
  }
  y += ah + 80 * S;
  // 입력창 — 빈 알약 (안내 글자 없음) + 보내기 원
  roundBox(g, Z.cx - Z.w * 0.45, y, Z.w * 0.9, inH, inH / 2, null, R.chip ? P.bg : P.line, 4 * S);
  g.fillStyle = R.hi; g.beginPath(); g.arc(Z.cx + Z.w * 0.45 - inH / 2, y + inH / 2, inH * 0.32, 0, TAU); g.fill();
};

// T19 화면 줌 + 스포트라이트 — 화면(줄 목록) → 누를 줄만 밝게 · 나머지 흐리게 → 그쪽으로 확대 → 말표 · wow: 확대가 멈출 때 테두리가 한 번 빛남
TYPES.spotlight = (g, t, d, c) => {
  base(g, t); const k = kb(d, BASE_DICT.spotlight), T = (x) => x * k, O = onSolid(), H2 = hiFill();
  const cw = Z.w * 0.94, pad = 34 * S, rows = c.rows, ti = c.target ?? 0;
